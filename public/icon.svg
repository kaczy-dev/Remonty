<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid lines -->
  <path d="M 64 128 H 448 M 64 256 H 448 M 64 384 H 448 M 128 64 V 448 M 256 64 V 448 M 384 64 V 448"
        stroke="#334155" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 4" />

  <!-- Ground / floor line -->
  <line x1="96" y1="392" x2="416" y2="392" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Kaczak: duck mascot wearing a builder's hard hat -->
  <g transform="translate(256, 256)">
    <!-- Body -->
    <ellipse cx="0" cy="70" rx="98" ry="80" fill="url(#duckGrad)" />
    <!-- Head -->
    <circle cx="58" cy="-40" r="66" fill="url(#duckGrad)" />
    <!-- Beak -->
    <path d="M 108 -32 C 148 -28 152 4 112 8 C 96 10 92 -6 96 -18 Z" fill="#ea580c" />
    <!-- Eye -->
    <circle cx="76" cy="-56" r="8" fill="#0f172a" />
    <!-- Hard hat -->
    <path d="M -6 -84 C -6 -122 30 -150 62 -150 C 98 -150 128 -124 130 -88 C 130 -80 124 -76 116 -76 L -2 -76 C -10 -76 -6 -80 -6 -84 Z" fill="url(#hatGrad)" />
    <rect x="-14" y="-80" width="152" height="16" rx="8" fill="url(#hatGrad)" />
    <!-- Wing -->
    <path d="M -50 40 C -90 30 -96 90 -60 108 C -36 118 -14 100 -18 76 C -22 54 -34 44 -50 40 Z" fill="#ea580c" fill-opacity="0.55" />
  </g>

  <!-- House roof accent, top -->
  <path d="M 116 176 L 256 92 L 396 176" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45" />
</svg>
