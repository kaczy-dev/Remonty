<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid lines -->
  <path d="M 64 128 H 448 M 64 256 H 448 M 64 384 H 448 M 128 64 V 448 M 256 64 V 448 M 384 64 V 448" 
        stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />

  <!-- Outer Room Boundary / Floorplan Walls -->
  <path d="M 120 130 H 392 V 382 H 240 V 382 H 120 Z" 
        fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />

  <!-- Inner Highlighted Architectural Contour -->
  <path d="M 140 150 H 372 V 362 H 260 V 270 H 140 Z" 
        fill="#06b6d4" fill-opacity="0.08" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Door Swing Arc -->
  <path d="M 260 270 A 50 50 0 0 1 210 320" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4" />
  <line x1="260" y1="270" x2="210" y2="270" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Dimension Indicator / Measure Arrow -->
  <line x1="140" y1="112" x2="372" y2="112" stroke="#10b981" stroke-width="4" />
  <path d="M 140 102 V 122 M 372 102 V 122" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <circle cx="256" cy="112" r="5" fill="#10b981" />

  <!-- Modern RenovAI Sparkle / AI Node Icon in Center-Left -->
  <g transform="translate(195, 205)">
    <path d="M 0 -28 C 0 -10 10 0 28 0 C 10 0 0 10 0 28 C 0 10 -10 0 -28 0 C -10 0 0 -10 0 -28 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- Modern RenovAI Sparkle (Secondary) -->
  <g transform="translate(320, 310)">
    <path d="M 0 -16 C 0 -6 6 0 16 0 C 6 0 0 6 0 16 C 0 6 -6 0 -16 0 C -6 0 0 -6 0 -16 Z" fill="#38bdf8" />
  </g>
</svg>
